name: CI/CD
on:
  pull_request:
    branches: [preprod, master]
  push:
    branches: [preprod, master]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TARGET_DIR: ${{ github.ref_name == 'master' && '/var/www/portfolio' || '/var/www/preprod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Faire confiance au serveur
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Synchroniser les fichiers
        run: |
          rsync -avz --delete \
            --chmod=D755,F644 \
            --exclude '.git' --exclude '.github' \
            --exclude 'README.md' --exclude 'docs' \
            --exclude 'tests' --exclude 'package.json' \
            --exclude 'package-lock.json' --exclude 'node_modules' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$TARGET_DIR/